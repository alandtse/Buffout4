name: "Lint PR"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

# pull_request_target grants the base-repo token even for fork PRs, so restrict it to
# the minimum the title-linter needs (it only reads the PR title; the job result is the check).
permissions:
  contents: read
  pull-requests: read

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@01d5fd8a8ebb9aafe902c40c53f0f4744f7381eb # v5.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}