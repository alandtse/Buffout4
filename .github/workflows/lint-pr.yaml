name: "Lint PR"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

# pull_request_target grants the base-repo token even for fork PRs, so restrict it to
# the minimum the title-linter needs (it only reads the PR title; the job result is the check).
permissions:
  contents: read
  pull-requests: read

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}