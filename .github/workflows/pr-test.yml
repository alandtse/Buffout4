name: PR Test Build

on:
  pull_request:
    paths:
      # Source files
      - 'src/**/*.cpp'
      - 'src/**/*.h'
      - 'src/**/*.hpp'
      # Build configuration
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'CMakePresets.json'
      # Dependencies
      - 'vcpkg.json'
      - '.gitmodules'
      - 'external/**'
      # Build scripts
      - 'scripts/**'
      # CI workflows that affect build
      - '.github/workflows/build-reusable.yml'
      - '.github/workflows/pr-test.yml'

jobs:
  test-build:
    name: Test Build
    uses: ./.github/workflows/build-reusable.yml
    with:
      configure-preset: vs2022-windows-vcpkg
      build-preset: Release
      upload-artifact: false
